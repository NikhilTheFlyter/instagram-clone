server:
  port: 8083

spring:
  application:
    name: follow-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/instagram_follow

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: follow-service
        health-check-interval: 10s

logging:
  level:
    com.instagram.follow: DEBUG
    org.springframework.data.mongodb: DEBUG
