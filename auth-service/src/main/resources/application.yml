server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/instagram_auth

  # Disable Spring Security auto-config (we handle auth manually with JWT)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Consul Service Discovery
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: auth-service
        health-check-interval: 10s

# Logging
logging:
  level:
    com.instagram.auth: DEBUG
    org.springframework.data.mongodb: DEBUG
